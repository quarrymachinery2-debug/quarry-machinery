<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarry Machinery & Construction | Komo, Kiambu County</title>
<meta name="description" content="Machine-cut Ndarugo building stone, quarry operations and machinery services in Komo, Kiambu County, Kenya.">
<link rel="icon" type="image/png" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-dark:#221f1c;
    --stone-charcoal:#2e2a25;
    --stone-sand:#c8a874;
    --stone-sand-light:#e7dcc4;
    --stone-cream:#f2ede1;
    --rust:#a8502c;
    --rust-dark:#823c20;
    --ink:#221f1c;
    --line: rgba(34,31,28,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Archivo', sans-serif;
    color:var(--ink);
    background:var(--stone-cream);
    line-height:1.55;
  }
  h1,h2,h3, .display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.01em;
    line-height:0.95;
    font-weight:400;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px;}

  /* NAV */
  header.site{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(34,31,28,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;max-width:1120px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;color:var(--stone-cream);text-decoration:none;}
  .brand .mark{
    width:34px;height:34px;flex:none;
    background:var(--rust);
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;color:var(--stone-cream);font-size:16px;
  }
  .brand .name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.03em;}
  nav.links{display:flex;gap:28px;}
  nav.links a{color:var(--stone-sand-light);text-decoration:none;font-size:14.5px;font-weight:600;letter-spacing:0.02em;}
  nav.links a:hover{color:var(--rust);}
  .nav-call{
    background:var(--rust);color:var(--stone-cream);text-decoration:none;
    padding:9px 18px;font-weight:700;font-size:14px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .mobile-hide{display:flex;}
  @media (max-width:760px){ .mobile-hide{display:none;} }

  /* HERO */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;align-items:flex-end;
    background:#000;
  }
  .hero img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    opacity:0.68;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(20,18,16,0.55) 0%, rgba(20,18,16,0.25) 35%, rgba(20,18,16,0.92) 100%);
  }
  .hero-content{position:relative;z-index:2;padding:0 28px 76px;max-width:1120px;margin:0 auto;width:100%;}
  .kicker{
    color:var(--stone-sand);font-weight:700;font-size:14px;letter-spacing:0.14em;
    margin:0 0 14px;
  }
  .hero h1{
    color:var(--stone-cream);
    font-size:clamp(48px,9vw,108px);
    margin:0 0 18px;
    max-width:900px;
  }
  .hero p.lede{
    color:var(--stone-sand-light);
    font-size:clamp(16px,2vw,20px);
    max-width:560px;
    margin:0 0 30px;
    font-weight:400;
  }
  .btn-row{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-block;text-decoration:none;font-weight:700;font-size:15px;
    padding:15px 26px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .btn-primary{background:var(--rust);color:var(--stone-cream);}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-ghost{background:rgba(242,237,225,0.08);color:var(--stone-cream);border:1px solid rgba(242,237,225,0.4);}
  .btn-ghost:hover{background:rgba(242,237,225,0.18);}

  /* STRIP */
  .strip{background:var(--rust);color:var(--stone-cream);}
  .strip .wrap{display:flex;flex-wrap:wrap;gap:10px 40px;padding:18px 28px;justify-content:space-between;}
  .strip span{font-weight:700;font-size:14.5px;}
  .strip span b{font-family:'Bebas Neue';font-size:17px;font-weight:400;letter-spacing:0.02em;margin-right:6px;}

  section{padding:96px 0;}
  .section-head{max-width:640px;margin:0 0 48px;}
  .section-head .kicker{color:var(--rust);}
  .section-head h2{font-size:clamp(34px,5vw,54px);margin:0 0 14px;color:var(--ink);}
  .section-head p{font-size:17px;color:#4c463d;margin:0;}

  /* ABOUT */
  .about{background:var(--stone-cream);}
  .about-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center;}
  .about-copy p{font-size:16.5px;color:#3a352d;margin:0 0 16px;}
  .about-photo{position:relative;}
  .about-photo img{
    width:100%;height:440px;object-fit:cover;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 34px), calc(100% - 34px) 100%, 0 100%);
  }
  .stat-card{
    position:absolute;bottom:-22px;left:-22px;
    background:var(--stone-dark);color:var(--stone-cream);
    padding:20px 24px;
    max-width:220px;
  }
  .stat-card .num{font-family:'Bebas Neue';font-size:38px;color:var(--stone-sand);display:block;}
  .stat-card .lbl{font-size:13px;color:var(--stone-sand-light);}
  @media (max-width:860px){
    .about-grid{grid-template-columns:1fr;}
    .stat-card{position:static;margin-top:18px;max-width:none;display:inline-block;}
  }

  /* SERVICES */
  .services{background:var(--stone-dark);color:var(--stone-cream);}
  .services .section-head h2{color:var(--stone-cream);}
  .services .section-head p{color:var(--stone-sand-light);}
  .services .kicker{color:var(--stone-sand);}
  .service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:rgba(242,237,225,0.12);}
  .service-card{
    background:var(--stone-dark);
    position:relative;
    overflow:hidden;
    min-height:340px;
    display:flex;align-items:flex-end;
  }
  .service-card img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:transform 0.5s ease;
    filter:saturate(0.92);
  }
  .service-card:hover i
